[project]
name = "usage"
version = "0.1.0"
description = "Private meter-reading tracker (water, electricity, gas, mileage) built with FastAPI and vanilla JavaScript."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "psycopg[binary]==3.2.9",
    "cryptography==45.0.6",
]

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "app"
packages = ["usage"]
exclude = "^tests/"
