# usage.edgy.world — Usage (app on 127.0.0.1:8063)
# Note: X-Content-Type-Options / X-Frame-Options / Referrer-Policy are set by
# the application middleware — duplicating them here would emit them twice.
# The active backend. deploy/deploy-prod.sh rewrites this file and reloads
# nginx to switch colours.
upstream usage_app {
    server 127.0.0.1:8063;   # blue
}

limit_req_zone $binary_remote_addr zone=usage_auth:10m rate=10r/m;

server {
    server_name usage.edgy.world;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Meter photos travel base64-encoded in JSON to the extraction endpoint:
    # a 10 MB photo needs ~14 MB of body.
    client_max_body_size 15m;

    location /api/auth/ {
        limit_req zone=usage_auth burst=20 nodelay;
        proxy_pass http://usage_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://usage_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/usage.edgy.world/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/usage.edgy.world/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = usage.edgy.world) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name usage.edgy.world;
    return 404; # managed by Certbot


}
