# Home Assistant side of the sensor feed: every ten minutes, POST the current
# value of each thermometer to usage.edgy.world, authenticated with the house's
# sensor token (Settings, Houses, "Sensor token" - admins only).
#
# 1. secrets.yaml:      usage_sensor_auth: "Bearer <the token>"
# 2. configuration.yaml: merge the `rest_command:` and `automation:` blocks
#    below (or `!include` them), adjust the entity map, then restart.
#
# Unknown entities become sensors in the app on their own, with the name given
# in the `entities` map below (rename or reorder them later in Settings,
# Sensors). Three rooms have both a SwitchBot and a Govee thermometer, hence
# the vendor in those names.
# A sample is keyed by the instant the value last changed (`last_changed`), so
# an unchanged value re-sent ten minutes later is not a duplicate.
#
# Each sample also carries `last_reported`, which is when the thermometer was
# last heard from rather than when its reading last moved. Home Assistant keeps
# three instants and only this one answers that question: `last_changed` moves
# when the value changes, `last_updated` when the value or an attribute does,
# and `last_reported` on every write, changed or not. A thermometer re-sending
# the same number is a no-op for the first two, so both would have the tile
# claim it had not been heard from since it last moved - half an hour ago for
# an outdoor sensor that only resolves to a fifth of a degree, and indefinitely
# for a room holding steady.
#
# The tile counts its age from `last_reported`; the graph is still keyed by
# `last_changed`, so the de-duplication above is untouched.
#
# Each sample also carries the charge of the thermometer that took it, shown on
# its tile in the app. The battery entity is not listed: it is the temperature
# one with `_temperature` replaced by `_battery`, which is how both the SwitchBot
# and the Govee integrations name them. A thermometer without such an entity, or
# one reporting `unknown`, simply sends no battery and its tile shows none.

rest_command:
  usage_sensor_samples:
    url: "https://usage.edgy.world/api/ingest/samples"
    method: post
    timeout: 30
    content_type: "application/json"
    headers:
      authorization: !secret usage_sensor_auth
    payload: >-
      {% set entities = {
        'sensor.switchbot_grenier_temperature': 'Grenier (SwitchBot)',
        'sensor.switchbot_freezer_temperature': 'Freezer',
        'sensor.switchbot_fridge_temperature': 'Fridge',
        'sensor.switchbot_router_temperature': 'Router (SwitchBot)',
        'sensor.switchbot_garage_temperature': 'Garage (SwitchBot)',
        'sensor.switchbot_dehors_temperature': 'Dehors',
        'sensor.h5100_3e52_temperature': 'Street Bedroom',
        'sensor.h5100_5b62_temperature': 'Garage (Govee)',
        'sensor.h5100_2517_temperature': 'Living Room',
        'sensor.h5100_3363_temperature': 'Router (Govee)',
        'sensor.h5100_7468_temperature': 'Grenier (Govee)',
        'sensor.govee_garden_bedroom_temperature': 'Garden Bedroom',
      } %}
      {% set ns = namespace(samples=[]) %}
      {% for entity_id, name in entities.items() %}
        {% set entry = states[entity_id] %}
        {% if entry is not none and is_number(entry.state) %}
          {% set charge = states[entity_id | replace('_temperature', '_battery')] %}
          {% set ns.samples = ns.samples + [{
            "entity_id": entity_id,
            "name": name,
            "unit": entry.attributes.unit_of_measurement | default(""),
            "value": entry.state | float,
            "measured_at": entry.last_changed.isoformat(),
            "reported_at": entry.last_reported.isoformat(),
            "battery": (charge.state | float | round | int) if (charge is not none and is_number(charge.state)) else none,
          }] %}
        {% endif %}
      {% endfor %}
      {{ {"samples": ns.samples} | to_json }}

  # ---------------------------------------------------------------------------
  # Solar: the Enphase gateway, pushed every minute.
  #
  # The gateway only answers on the house's own network and the app runs on a VPS,
  # so this is the only way its live readings can reach it - the same arrangement
  # as the thermometers, on the same token. Add the "Enphase Envoy" integration in
  # Home Assistant first (Settings, Devices & Services); it finds the gateway on
  # the LAN and handles the token its firmware wants.
  #
  # The entity names carry the gateway's serial. These are this house's, read off
  # its own registry; another gateway means another serial. Check with Developer
  # Tools, States, filtered on "envoy".
  #
  # What is sent and why:
  #   *_lifetime_energy_*  the counters. The app differences two consecutive
  #                        pushes to get the energy between them, exactly as it
  #                        does with a meter reading, so a push that goes missing
  #                        costs nothing: the next one simply spans longer.
  #   *_current_power_*    what the panels and the house are doing this second.
  #                        This is what the tiles show, and it is the whole reason
  #                        for pushing at all rather than waiting on the cloud API.
  #   *_unit               every reading names its own unit and the app converts.
  #                        This Envoy reports kW and MWh, not W and Wh, and Home
  #                        Assistant lets a display unit be overridden from the
  #                        interface - so a factor baked in here would be one
  #                        settings change away from being wrong by a thousand.
  #   battery              state of charge, in percent. A system without batteries
  #                        simply has no such entity and sends none.
  #
  # The house needs its "Solar panels and batteries" switch on (Settings, Houses,
  # Edit) before any of this appears on the Realtime page.
  usage_power_push:
    url: "https://usage.edgy.world/api/ingest/power"
    method: post
    timeout: 30
    content_type: "application/json"
    headers:
      authorization: !secret usage_sensor_auth
    payload: >-
      {% set produced = 'sensor.envoy_202329053381_lifetime_energy_production' %}
      {% set consumed = 'sensor.envoy_202329053381_lifetime_energy_consumption' %}
      {% set making = 'sensor.envoy_202329053381_current_power_production' %}
      {% set drawing = 'sensor.envoy_202329053381_current_power_consumption' %}
      {% set charge = 'sensor.envoy_202329053381_battery' %}
      {{ {
        "measured_at": now().isoformat(),
        "production_lifetime": states(produced) | float if is_number(states(produced)) else none,
        "production_lifetime_unit": state_attr(produced, 'unit_of_measurement') | default('', true),
        "consumption_lifetime": states(consumed) | float if is_number(states(consumed)) else none,
        "consumption_lifetime_unit": state_attr(consumed, 'unit_of_measurement') | default('', true),
        "production_power": states(making) | float if is_number(states(making)) else none,
        "production_power_unit": state_attr(making, 'unit_of_measurement') | default('', true),
        "consumption_power": states(drawing) | float if is_number(states(drawing)) else none,
        "consumption_power_unit": state_attr(drawing, 'unit_of_measurement') | default('', true),
        "battery_level": states(charge) | float if is_number(states(charge)) else none,
      } | to_json }}

automation:
  - alias: "Usage: push the thermometers"
    id: usage_push_thermometers
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/10"
    actions:
      - action: rest_command.usage_sensor_samples

  - alias: "Usage: push the solar"
    id: usage_push_solar
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    actions:
      - action: rest_command.usage_power_push
